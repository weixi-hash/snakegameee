name: Build APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version Name'
        required: false
        default: 'v0.1.0'
      versionCode:
        description: 'Version Code'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >
            platforms;android-34
            build-tools;34.0.0

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/

      - name: Init npm project
        run: npm init -y

      - name: Install Capacitor
        run: npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0

      - name: Init Capacitor
        run: npx cap init "Snake Game" "com.snakegame.app" --web-dir "www"

      - name: Configure remote URL
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.snakegame.app",
            "appName": "Snake Game",
            "webDir": "www",
            "server": {
              "url": "https://weixi-hash.github.io/snakegameee/",
              "cleartext": false
            }
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
